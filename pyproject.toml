[project]
name = "lisa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jemuel B Jeroham", email = "jemuelbjeroham@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2.3.0",
    "asyncpg>=0.31.0",
    "deepeval>=4.3.2",
    "jsonschema>=4.26.0",
    "langchain-community==0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.6.1",
    "langfuse>=5.0.1",
    "langgraph>=1.2.11",
    "mcp>=2.1.1",
    "openai>=3.9.0",
    "pillow>=13.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "ragas>=0.3.1",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
lisa = "lisa:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_guard: run without stubbing the HITL tool guard",
]
